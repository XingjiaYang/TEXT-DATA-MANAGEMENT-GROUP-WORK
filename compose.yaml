# Optional Elasticsearch baseline for the search comparison (local use only).
#   docker compose up -d          # start
#   docker compose down           # stop (index data is kept in the es-data volume)
# Heap size can be changed with ES_HEAP, e.g. ES_HEAP=4g docker compose up -d
services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.5
    container_name: yelp-es
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms${ES_HEAP:-8g} -Xmx${ES_HEAP:-8g}
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    ulimits:
      nofile: { soft: 65536, hard: 65536 }

volumes:
  es-data:
